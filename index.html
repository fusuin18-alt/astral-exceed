<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astral Arena - Toon Style</title>
    <style>
        * { touch-action: manipulation; }
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;
        }
        .hud-top {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.85); padding: 12px 20px; border-radius: 16px;
            border: 2px solid #ffaa00; backdrop-filter: blur(5px); margin: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .stat-box { color: #333; font-weight: bold; font-size: 15px; }
        .greed-meter {
            width: 120px; height: 14px; background: #eee; border-radius: 7px; overflow: hidden; border: 2px solid #ff5555;
        }
        .greed-fill { width: 30%; height: 100%; background: linear-gradient(90deg, #ffbb00, #ff3333); transition: width 0.3s; }

        /* Virtual Joystick */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.4); border: 3px solid rgba(255, 170, 0, 0.8);
            border-radius: 50%; pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        #joystick-knob {
            width: 55px; height: 55px; background: #ffaa00;
            border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); pointer-events: none;
        }

        /* Skill Buttons */
        .hud-bottom-right {
            position: absolute; bottom: 30px; right: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; pointer-events: auto;
        }
        .skill-btn {
            width: 60px; height: 60px; background: #ffffff; border: 3px solid #00aaff;
            border-radius: 50%; color: #00aaff; font-weight: bold; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; font-size: 12px;
            box-shadow: 0 5px 15px rgba(0, 170, 255, 0.3); -webkit-tap-highlight-color: transparent;
        }
        .skill-btn:active { transform: scale(0.9); background: #e0f3ff; }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; color: #333; padding: 35px; border-radius: 24px;
            border: 4px solid #ff5555; text-align: center; display: none; pointer-events: auto; width: 80%; max-width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        button.restart-btn {
            padding: 12px 25px; background: #ff5555; border: none; color: white;
            font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 10px rgba(255, 85, 85, 0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-box" id="score-display">⏱️ 0s | W1</div>
            <div>
                <span style="color: #ff5555; font-size: 10px; font-weight: bold;">GREED RISK</span>
                <div class="greed-meter"><div class="greed-fill" id="greed-bar"></div></div>
            </div>
            <div class="stat-box" style="color:#ffaa00;" id="relic-display">💎 0</div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>

        <div class="hud-bottom-right">
            <div class="skill-btn" id="btn-q">베기</div>
            <div class="skill-btn" style="border-color:#ff5555; color:#ff5555;" id="btn-r">폭발</div>
        </div>
    </div>

    <div id="game-over">
        <h2 style="color: #ff5555; margin: 0 0 10px 0;">GAME OVER</h2>
        <p id="final-stats" style="color: #666; font-weight: bold;">생존 시간: 0초</p>
        <button class="restart-btn" onclick="location.reload()">다시 도전</button>
    </div>

    <script>
        // --- 3D Scene Setup (Bright Anime Sky) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xddeeff);
        scene.fog = new THREE.FogExp2(0xddeeff, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- Toon Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffee, 1.2);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Arena Platform (Cartoon Style Circle) ---
        const platformGeo = new THREE.CylinderGeometry(18, 19, 1.5, 32);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x88cc44, roughness: 0.6 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.y = -0.75;
        scene.add(platform);

        // Decorative Training Dummies (허수아비 구조물)
        function createDummy(x, z) {
            const dummyGroup = new THREE.Group();
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.2, 2.5),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
            );
            pole.position.y = 1.25;
            dummyGroup.add(pole);

            const head = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.6),
                new THREE.MeshStandardMaterial({ color: 0xffeedd })
            );
            head.position.y = 2.5;
            dummyGroup.add(head);

            dummyGroup.position.set(x, 0, z);
            scene.add(dummyGroup);
        }
        createDummy(-12, -12);
        createDummy(12, -12);

        // --- Cute Stylized Player ---
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, roughness: 0.3 });
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 0.8, 8, 16), bodyMat);
        body.position.y = 0.9;
        playerGroup.add(body);

        // Cute Horns/Ears
        const earMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
        const earL = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 4), earMat);
        earL.position.set(-0.3, 1.6, 0);
        playerGroup.add(earL);
        const earR = earL.clone();
        earR.position.x = 0.3;
        playerGroup.add(earR);

        scene.add(playerGroup);

        // --- Game States ---
        let enemies = [], relics = [];
        let score = 0, greed = 30;
        let isGameOver = false;
        let startTime = Date.now();
        let moveVector = { x: 0, z: 0 };

        // --- Joystick Controls ---
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };

        joyZone.addEventListener('touchstart', e => {
            joyActive = true;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            handleJoystick(e.touches[0]);
        });
        window.addEventListener('touchmove', e => { if(joyActive) handleJoystick(e.touches[0]); });
        window.addEventListener('touchend', () => {
            joyActive = false;
            joyKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        });

        function handleJoystick(touch) {
            const dx = touch.clientX - joyCenter.x;
            const dy = touch.clientY - joyCenter.y;
            const dist = Math.min(Math.hypot(dx, dy), 45);
            const angle = Math.atan2(dy, dx);
            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveVector.x = (Math.cos(angle)*dist) / 45;
            moveVector.z = (Math.sin(angle)*dist) / 45;
        }

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // --- Skills ---
        function triggerSkill(type) {
            if(isGameOver) return;
            if(type === 'Q') {
                const waveMesh = new THREE.Mesh(
                    new THREE.RingGeometry(0.5, 3.5, 16),
                    new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
                );
                waveMesh.rotation.x = -Math.PI / 2;
                waveMesh.position.copy(playerGroup.position);
                waveMesh.position.y = 0.2;
                scene.add(waveMesh);
                setTimeout(() => scene.remove(waveMesh), 250);

                enemies.forEach(e => {
                    if(e.mesh.position.distanceTo(playerGroup.position) < 4.5) e.hp -= 30;
                });
            } else if(type === 'R') {
                greed = Math.min(100, greed + 15);
                const exp = new THREE.Mesh(
                    new THREE.SphereGeometry(6, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xff5555, wireframe: true })
                );
                exp.position.copy(playerGroup.position);
                scene.add(exp);
                setTimeout(() => scene.remove(exp), 300);

                enemies.forEach(e => {
                    if(e.mesh.position.distanceTo(playerGroup.position) < 7) e.hp -= 100;
                });
            }
        }

        document.getElementById('btn-q').addEventListener('click', () => triggerSkill('Q'));
        document.getElementById('btn-r').addEventListener('click', () => triggerSkill('R'));

        // --- Spawners ---
        setInterval(() => {
            if(isGameOver) return;
            const enemyGroup = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.7),
                new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.4 })
            );
            mesh.position.y = 0.8;
            enemyGroup.add(mesh);

            const angle = Math.random() * Math.PI * 2;
            enemyGroup.position.set(Math.cos(angle) * 16, 0, Math.sin(angle) * 16);
            scene.add(enemyGroup);
            enemies.push({ mesh: enemyGroup, hp: 20, speed: 0.04 + (greed * 0.0008) });
        }, 1600);

        setInterval(() => {
            if(isGameOver) return;
            const relic = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.5),
                new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00 })
            );
            relic.position.set((Math.random() - 0.5) * 24, 1, (Math.random() - 0.5) * 24);
            scene.add(relic);
            relics.push(relic);
        }, 5000);

        // --- Loop ---
        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            let dx = moveVector.x;
            let dz = moveVector.z;
            if (keys['w'] || keys['arrowup']) dz = -1;
            if (keys['s'] || keys['arrowdown']) dz = 1;
            if (keys['a'] || keys['arrowleft']) dx = -1;
            if (keys['d'] || keys['arrowright']) dx = 1;

            const speed = 0.12;
            playerGroup.position.x += dx * speed;
            playerGroup.position.z += dz * speed;
            playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x, -15, 15);
            playerGroup.position.z = THREE.MathUtils.clamp(playerGroup.position.z, -15, 15);

            relics.forEach((relic, idx) => {
                relic.rotation.y += 0.04;
                if(relic.position.distanceTo(playerGroup.position) < 1.3) {
                    scene.remove(relic);
                    relics.splice(idx, 1);
                    score += 100;
                    greed = Math.min(100, greed + 10);
                    document.getElementById('relic-display').innerText = `💎 ${Math.floor(score/100)}`;
                }
            });

            enemies.forEach((enemy, idx) => {
                enemy.mesh.lookAt(playerGroup.position);
                enemy.mesh.translateZ(enemy.speed);

                if(enemy.mesh.position.distanceTo(playerGroup.position) < 1.0) {
                    endGame();
                }

                if(enemy.hp <= 0) {
                    scene.remove(enemy.mesh);
                    enemies.splice(idx, 1);
                }
            });

            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('score-display').innerText = `⏱️ ${elapsedTime}s | W${Math.floor(elapsedTime/15) + 1}`;
            document.getElementById('greed-bar').style.width = `${greed}%`;

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('final-stats').innerText = `생존 시간: ${elapsedTime}초 | 수집 유물: ${Math.floor(score/100)}개`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
