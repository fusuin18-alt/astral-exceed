<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astral Arena 3D</title>
    <style>
        * { touch-action: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;
        }
        .hud-top {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.9); padding: 10px 15px; border-radius: 12px;
            margin: 10px; border: 2px solid #ffaa00; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-box { color: #333; font-weight: bold; font-size: 14px; }
        .greed-meter { width: 100px; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; border: 1px solid #ff5555; }
        .greed-fill { width: 30%; height: 100%; background: #ff5555; transition: width 0.3s; }

        /* Joystick Zone */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.5); border: 3px solid #ffaa00;
            border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: #ffaa00; border-radius: 50%; pointer-events: none;
        }

        /* Buttons Zone */
        .hud-bottom-right {
            position: absolute; bottom: 30px; right: 20px; display: flex; gap: 10px; pointer-events: auto;
        }
        .skill-btn {
            width: 60px; height: 60px; background: #fff; border: 3px solid #00aaff;
            border-radius: 50%; color: #00aaff; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        #error-log {
            position: absolute; top: 70px; left: 10px; color: red; background: rgba(0,0,0,0.8);
            padding: 10px; border-radius: 8px; display: none; font-size: 12px; max-width: 90vw; z-index: 999;
        }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; color: #333; padding: 30px; border-radius: 20px;
            border: 4px solid #ff5555; text-align: center; display: none; pointer-events: auto;
        }
    </style>
    <!-- 백업 CDN 연결 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="error-log"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-box" id="score-display">0s | W1</div>
            <div>
                <span style="color: #ff5555; font-size: 10px; font-weight: bold;">GREED</span>
                <div class="greed-meter"><div class="greed-fill" id="greed-bar"></div></div>
            </div>
            <div class="stat-box" style="color:#ffaa00;" id="relic-display">💎 0</div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>

        <div class="hud-bottom-right">
            <div class="skill-btn" id="btn-q">공격</div>
            <div class="skill-btn" style="border-color:#ff5555; color:#ff5555;" id="btn-r">폭발</div>
        </div>
    </div>

    <div id="game-over">
        <h2 style="color: #ff5555; margin: 0;">GAME OVER</h2>
        <p id="final-stats">생존 시간: 0초</p>
        <button style="padding: 10px 20px; background: #ff5555; color:#fff; border:none; border-radius:8px; font-weight:bold;" onclick="location.reload()">다시 시작</button>
    </div>

    <script>
        // 에러 감지용 스크립트
        window.onerror = function(msg, url, line) {
            const errBox = document.getElementById('error-log');
            errBox.style.display = 'block';
            errBox.innerHTML = `⚠️ 에러 발생: ${msg} (Line: ${line})`;
        };

        // 3D Scene 준비
        if (typeof THREE === 'undefined') {
            document.getElementById('error-log').style.display = 'block';
            document.getElementById('error-log').innerText = '⚠️ Three.js 3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.';
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xddeeff);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 14);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 조명
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x666666));

        // 맵 (원형 아레나)
        const platform = new THREE.Mesh(
            new THREE.CylinderGeometry(15, 15, 1, 32),
            new THREE.MeshLambertMaterial({ color: 0x88cc44 })
        );
        platform.position.y = -0.5;
        scene.add(platform);

        // 플레이어 캐릭터
        const player = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 1.5, 16),
            new THREE.MeshLambertMaterial({ color: 0x00aaff })
        );
        player.position.y = 0.75;
        scene.add(player);

        // 게임 변수
        let enemies = [], relics = [];
        let score = 0, greed = 30, isGameOver = false;
        let startTime = Date.now();
        let moveVec = { x: 0, z: 0 };

        // 조이스틱 조작
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyActive = false;

        joyZone.addEventListener('pointerdown', e => { joyActive = true; updateJoy(e); });
        window.addEventListener('pointermove', e => { if(joyActive) updateJoy(e); });
        window.addEventListener('pointerup', () => {
            joyActive = false;
            joyKnob.style.transform = `translate(0px, 0px)`;
            moveVec = { x: 0, z: 0 };
        });

        function updateJoy(e) {
            const rect = joyZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = e.clientX - cx;
            const dy = e.clientY - cy;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);
            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveVec.x = (Math.cos(angle)*dist) / 40;
            moveVec.z = (Math.sin(angle)*dist) / 40;
        }

        // 키보드 조작 (PC)
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // 스킬
        document.getElementById('btn-q').addEventListener('click', () => {
            if(isGameOver) return;
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.5, 3, 16),
                new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(player.position);
            scene.add(ring);
            setTimeout(() => scene.remove(ring), 200);

            enemies.forEach(e => {
                if(e.mesh.position.distanceTo(player.position) < 3.5) e.hp -= 30;
            });
        });

        document.getElementById('btn-r').addEventListener('click', () => {
            if(isGameOver) return;
            greed = Math.min(100, greed + 15);
            enemies.forEach(e => {
                if(e.mesh.position.distanceTo(player.position) < 6) e.hp -= 100;
            });
        });

        // 적 스폰
        setInterval(() => {
            if(isGameOver) return;
            const enemyMesh = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshLambertMaterial({ color: 0xff3355 })
            );
            const angle = Math.random() * Math.PI * 2;
            enemyMesh.position.set(Math.cos(angle) * 14, 0.5, Math.sin(angle) * 14);
            scene.add(enemyMesh);
            enemies.push({ mesh: enemyMesh, hp: 20, speed: 0.05 });
        }, 1500);

        // 메인 게임 루프
        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // 이동 처리
            let dx = moveVec.x;
            let dz = moveVec.z;
            if (keys['w'] || keys['arrowup']) dz = -1;
            if (keys['s'] || keys['arrowdown']) dz = 1;
            if (keys['a'] || keys['arrowleft']) dx = -1;
            if (keys['d'] || keys['arrowright']) dx = 1;

            player.position.x += dx * 0.12;
            player.position.z += dz * 0.12;
            player.position.x = Math.max(-13, Math.min(13, player.position.x));
            player.position.z = Math.max(-13, Math.min(13, player.position.z));

            // 적 AI 및 충돌
            enemies.forEach((e, idx) => {
                e.mesh.lookAt(player.position);
                e.mesh.translateZ(e.speed);

                if(e.mesh.position.distanceTo(player.position) < 0.9) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'block';
                }

                if(e.hp <= 0) {
                    scene.remove(e.mesh);
                    enemies.splice(idx, 1);
                }
            });

            // HUD
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('score-display').innerText = `${elapsed}s | W1`;
            document.getElementById('greed-bar').style.width = `${greed}%`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
