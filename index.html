<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astral Exceed - Lyra's Raid</title>
    <style>
        * { touch-action: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background-color: #030310; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;
        }
        .hud-top {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(10, 10, 30, 0.85); padding: 12px; border-radius: 14px;
            margin: 15px; border: 2px solid #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.4);
        }
        .boss-name { color: #00f0ff; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-shadow: 0 0 8px #00f0ff; }
        .boss-hp-bar { width: 80vw; max-width: 400px; height: 14px; background: #111122; border-radius: 7px; overflow: hidden; border: 1px solid #00ffff; }
        .boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00f0ff, #9900ff); transition: width 0.2s; }

        .hud-sub {
            display: flex; justify-content: space-between; width: 100%; padding: 0 20px; box-sizing: border-box; margin-top: 5px;
        }
        .stat-box { color: #fff; font-weight: bold; font-size: 13px; text-shadow: 0 0 5px #ff00ff; }

        /* Joystick Zone */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 3px solid rgba(0,240,255,0.6);
            border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: #00f0ff; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 10px #00f0ff;
        }

        /* Buttons Zone */
        .hud-bottom-right {
            position: absolute; bottom: 30px; right: 20px; display: flex; gap: 12px; pointer-events: auto;
        }
        .skill-btn {
            width: 65px; height: 65px; background: rgba(10,10,30,0.8); border: 3px solid #00f0ff;
            border-radius: 50%; color: #00f0ff; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 0 10px rgba(0,240,255,0.4);
        }
        .skill-btn:active { transform: scale(0.9); background: rgba(0,240,255,0.3); }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0a0515; color: #fff; padding: 35px; border-radius: 20px;
            border: 3px solid #00f0ff; text-align: center; display: none; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0,240,255,0.6);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="boss-name">✨ [ASTRAL GUARDIAN] 보스 레이드</div>
            <div class="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-bar"></div></div>
            <div class="hud-sub">
                <div class="stat-box" id="time-display">⏱️ 0s</div>
                <div class="stat-box" style="color:#00ffff;" id="lyra-name">HERO: LYRA</div>
            </div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>

        <div class="hud-bottom-right">
            <div class="skill-btn" id="btn-q">창격</div>
            <div class="skill-btn" style="border-color:#ff00ff; color:#ff00ff;" id="btn-r">방어막</div>
        </div>
    </div>

    <div id="game-over">
        <h2 id="result-title" style="color: #00f0ff; margin: 0 0 10px 0;">VICTORY</h2>
        <p id="final-stats" style="color: #aaa;">전투에서 승리했습니다!</p>
        <button style="padding: 12px 25px; background: #00f0ff; color:#030310; border:none; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="location.reload()">다시 도전</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030310);
        scene.fog = new THREE.FogExp2(0x030310, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 조명
        scene.add(new THREE.AmbientLight(0x303050, 1.5));
        const dirLight = new THREE.DirectionalLight(0x00ffff, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 네온 그리드 플로어 맵
        const gridHelper = new THREE.GridHelper(36, 36, 0x00f0ff, 0x330066);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(36, 1, 36),
            new THREE.MeshStandardMaterial({ color: 0x0a0518, roughness: 0.8 })
        );
        platform.position.y = -0.5;
        scene.add(platform);

        // --- 주인공 캐릭터 (Lyra 스타일) ---
        const playerGroup = new THREE.Group();
        
        // 몸체 (아머 슈트)
        const body = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.4, 0.8, 8, 16),
            new THREE.MeshStandardMaterial({ color: 0x9933ff, emissive: 0x330066 })
        );
        body.position.y = 0.8;
        playerGroup.add(body);

        // 푸른빛 헤어
        const hair = new THREE.Mesh(
            new THREE.ConeGeometry(0.45, 0.6, 5),
            new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x0088aa })
        );
        hair.position.set(0, 1.5, 0);
        playerGroup.add(hair);

        // 크리스탈 창 (Aether Spear)
        const spear = new THREE.Mesh(
            new THREE.CylinderGeometry(0.05, 0.05, 2.2),
            new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff })
        );
        spear.position.set(0.6, 1.0, 0.3);
        spear.rotation.z = -Math.PI / 6;
        playerGroup.add(spear);

        playerGroup.position.set(0, 0, 8);
        scene.add(playerGroup);

        // --- 보스 몬스터 ---
        const bossGroup = new THREE.Group();
        const bossBody = new THREE.Mesh(
            new THREE.DodecahedronGeometry(2.2),
            new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x550022, wireframe: true })
        );
        bossBody.position.y = 2;
        bossGroup.add(bossBody);
        bossGroup.position.set(0, 0, -8);
        scene.add(bossGroup);

        // 게임 상태
        let bossHp = 1000;
        const maxBossHp = 1000;
        let isGameOver = false;
        let startTime = Date.now();
        let moveVec = { x: 0, z: 0 };
        let projectiles = [];

        // 조이스틱
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyActive = false;

        joyZone.addEventListener('pointerdown', e => { joyActive = true; updateJoy(e); });
        window.addEventListener('pointermove', e => { if(joyActive) updateJoy(e); });
        window.addEventListener('pointerup', () => {
            joyActive = false;
            joyKnob.style.transform = `translate(0px, 0px)`;
            moveVec = { x: 0, z: 0 };
        });

        function updateJoy(e) {
            const rect = joyZone.getBoundingClientRect();
            const dx = e.clientX - (rect.left + rect.width / 2);
            const dy = e.clientY - (rect.top + rect.height / 2);
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);
            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveVec.x = (Math.cos(angle)*dist) / 40;
            moveVec.z = (Math.sin(angle)*dist) / 40;
        }

        // 스킬 버튼 액션 (Aether Strike & Barrier)
        document.getElementById('btn-q').addEventListener('click', () => {
            if(isGameOver) return;
            createRingEffect(playerGroup.position, 0x00ffff);
            if(playerGroup.position.distanceTo(bossGroup.position) < 7) {
                bossHp -= 50;
                checkBossHp();
            }
        });

        document.getElementById('btn-r').addEventListener('click', () => {
            if(isGameOver) return;
            createRingEffect(playerGroup.position, 0xff00ff);
            // 방어막 효과 (일시적 무적 또는 힐)
        });

        function createRingEffect(pos, colorHex) {
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.5, 3.5, 16),
                new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(pos);
            ring.position.y = 0.1;
            scene.add(ring);
            setTimeout(() => scene.remove(ring), 300);
        }

        function checkBossHp() {
            document.getElementById('boss-hp-bar').style.width = `${Math.max(0, (bossHp / maxBossHp) * 100)}%`;
            if(bossHp <= 0) {
                isGameOver = true;
                document.getElementById('result-title').innerText = "VICTORY!";
                document.getElementById('final-stats').innerText = "보스를 물리치고 승리했습니다!";
                document.getElementById('game-over').style.display = 'block';
            }
        }

        // 보스 공격 패턴
        setInterval(() => {
            if(isGameOver) return;
            const proj = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff0055 })
            );
            proj.position.copy(bossGroup.position);
            proj.position.y = 2;
            scene.add(proj);
            
            const dir = new THREE.Vector3().subVectors(playerGroup.position, proj.position).normalize();
            projectiles.push({ mesh: proj, dir: dir, speed: 0.12 });
        }, 1800);

        // 루프
        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            playerGroup.position.x += moveVec.x * 0.13;
            playerGroup.position.z += moveVec.z * 0.13;
            playerGroup.position.x = Math.max(-15, Math.min(15, playerGroup.position.x));
            playerGroup.position.z = Math.max(-15, Math.min(15, playerGroup.position.z));

            projectiles.forEach((p, idx) => {
                p.mesh.position.addScaledVector(p.dir, p.speed);
                if(p.mesh.position.distanceTo(playerGroup.position) < 0.9) {
                    isGameOver = true;
                    document.getElementById('result-title').innerText = "DEFEATED";
                    document.getElementById('result-title').style.color = "#ff0055";
                    document.getElementById('final-stats').innerText = "보스의 공격에 쓰러졌습니다.";
                    document.getElementById('game-over').style.display = 'block';
                }
            });

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('time-display').innerText = `⏱️ ${elapsed}s`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
