<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astral Raid - Boss Battle</title>
    <style>
        * { touch-action: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background-color: #1a0510; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;
        }
        .hud-top {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(20, 10, 25, 0.85); padding: 12px; border-radius: 14px;
            margin: 15px; border: 2px solid #ff3355; box-shadow: 0 0 15px rgba(255,51,85,0.4);
        }
        .boss-name { color: #ff3355; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-shadow: 0 0 8px #ff3355; }
        .boss-hp-bar { width: 80vw; max-width: 400px; height: 14px; background: #331122; border-radius: 7px; overflow: hidden; border: 1px solid #ff5577; }
        .boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00); transition: width 0.2s; }

        .hud-sub {
            display: flex; justify-content: space-between; width: 100%; padding: 0 20px; box-sizing: border-box; margin-top: 5px;
        }
        .stat-box { color: #fff; font-weight: bold; font-size: 13px; text-shadow: 0 0 5px #00ffff; }

        /* Joystick Zone */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 3px solid rgba(0,255,255,0.6);
            border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: #00ffff; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 10px #00ffff;
        }

        /* Buttons Zone */
        .hud-bottom-right {
            position: absolute; bottom: 30px; right: 20px; display: flex; gap: 12px; pointer-events: auto;
        }
        .skill-btn {
            width: 65px; height: 65px; background: rgba(20,20,40,0.8); border: 3px solid #00ffff;
            border-radius: 50%; color: #00ffff; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,255,0.4);
        }
        .skill-btn:active { transform: scale(0.9); background: rgba(0,255,255,0.3); }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #110515; color: #fff; padding: 35px; border-radius: 20px;
            border: 3px solid #ff0055; text-align: center; display: none; pointer-events: auto;
            box-shadow: 0 0 30px rgba(255,0,85,0.6);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="boss-name">🔥 [Raid Boss] 크리스탈 드래곤</div>
            <div class="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-bar"></div></div>
            <div class="hud-sub">
                <div class="stat-box" id="time-display">⏱️ 0s</div>
                <div class="stat-box" style="color:#ffcc00;" id="score-display">💎 0</div>
            </div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>

        <div class="hud-bottom-right">
            <div class="skill-btn" id="btn-q">차원참</div>
            <div class="skill-btn" style="border-color:#ff0055; color:#ff0055;" id="btn-r">초신성</div>
        </div>
    </div>

    <div id="game-over">
        <h2 id="result-title" style="color: #ff0055; margin: 0 0 10px 0;">DEFEATED</h2>
        <p id="final-stats" style="color: #aaa;">보스에게 패배했습니다.</p>
        <button style="padding: 12px 25px; background: #ff0055; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="location.reload()">다시 도전</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new 동적씬 = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0510);
        scene.fog = new THREE.FogExp2(0x0a0510, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 조명 (붉은 보스 광원 효과)
        scene.add(new THREE.AmbientLight(0x403050, 1.5));
        const bossLight = new THREE.PointLight(0xff0055, 3, 20);
        bossLight.position.set(0, 5, -8);
        scene.add(bossLight);

        // 배틀 아레나 맵
        const platform = new THREE.Mesh(
            new THREE.CylinderGeometry(16, 17, 1, 32),
            new THREE.MeshStandardMaterial({ color: 0x151025, roughness: 0.8 })
        );
        platform.position.y = -0.5;
        scene.add(platform);

        // 플레이어 캐릭터
        const player = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.4, 0.8, 8, 16),
            new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004466 })
        );
        player.position.set(0, 0.8, 8);
        scene.add(player);

        // --- 거대 보스 몬스터 (크리스탈 드래곤 느낌) ---
        const bossGroup = new THREE.Group();
        const bossBody = new THREE.Mesh(
            new THREE.BoxGeometry(3.5, 2.5, 4),
            new THREE.MeshStandardMaterial({ color: 0x332233, roughness: 0.5 })
        );
        bossBody.position.y = 1.5;
        bossGroup.add(bossBody);

        // 보스 등껍질 수정 가시들
        for(let i = -1.5; i <= 1.5; i += 1.0) {
            const crystal = new THREE.Mesh(
                new THREE.ConeGeometry(0.6, 2.5, 4),
                new THREE.MeshStandardMaterial({ color: 0xff0044, emissive: 0x550011 })
            );
            crystal.position.set(i, 3.2, 0);
            bossGroup.add(crystal);
        }
        bossGroup.position.set(0, 0, -8);
        scene.add(bossGroup);

        // 게임 상태
        let bossHp = 1000;
        const maxBossHp = 1000;
        let score = 0, isGameOver = false;
        let startTime = Date.now();
        let moveVec = { x: 0, z: 0 };
        let projectiles = [];

        // 조이스틱
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyActive = false;

        joyZone.addEventListener('pointerdown', e => { joyActive = true; updateJoy(e); });
        window.addEventListener('pointermove', e => { if(joyActive) updateJoy(e); });
        window.addEventListener('pointerup', () => {
            joyActive = false;
            joyKnob.style.transform = `translate(0px, 0px)`;
            moveVec = { x: 0, z: 0 };
        });

        function updateJoy(e) {
            const rect = joyZone.getBoundingClientRect();
            const dx = e.clientX - (rect.left + rect.width / 2);
            const dy = e.clientY - (rect.top + rect.height / 2);
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);
            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveVec.x = (Math.cos(angle)*dist) / 40;
            moveVec.z = (Math.sin(angle)*dist) / 40;
        }

        // 스킬 버튼 액션 (보스 타격)
        document.getElementById('btn-q').addEventListener('click', () => {
            if(isGameOver) return;
            createSlashEffect(player.position);
            if(player.position.distanceTo(bossGroup.position) < 7) {
                bossHp -= 40;
                checkBossHp();
            }
        });

        document.getElementById('btn-r').addEventListener('click', () => {
            if(isGameOver) return;
            createNovaEffect(player.position);
            if(player.position.distanceTo(bossGroup.position) < 10) {
                bossHp -= 150;
                checkBossHp();
            }
        });

        function createSlashEffect(pos) {
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.5, 3, 16),
                new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(pos);
            ring.position.y = 0.2;
            scene.add(ring);
            setTimeout(() => scene.remove(ring), 250);
        }

        function createNovaEffect(pos) {
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(5, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true })
            );
            sphere.position.copy(pos);
            scene.add(sphere);
            setTimeout(() => scene.remove(sphere), 300);
        }

        function checkBossHp() {
            document.getElementById('boss-hp-bar').style.width = `${Math.max(0, (bossHp / maxBossHp) * 100)}%`;
            if(bossHp <= 0) {
                isGameOver = true;
                document.getElementById('result-title').innerText = "VICTORY!";
                document.getElementById('result-title').style.color = "#00ffff";
                document.getElementById('final-stats').innerText = "보스를 처치하고 승리했습니다!";
                document.getElementById('game-over').style.display = 'block';
            }
        }

        // 보스의 공격 패턴 (주기적으로 플레이어에게 탄환 발사)
        setInterval(() => {
            if(isGameOver) return;
            const proj = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff3300 })
            );
            proj.position.copy(bossGroup.position);
            proj.position.y = 2;
            scene.add(proj);
            
            // 플레이어 방향 향하기
            const dir = new THREE.Vector3().subVectors(player.position, proj.position).normalize();
            projectiles.push({ mesh: proj, dir: dir, speed: 0.1 });
        }, 2000);

        // 메인 루프
        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // 플레이어 이동
            player.position.x += moveVec.x * 0.13;
            player.position.z += moveVec.z * 0.13;
            player.position.x = Math.max(-13, Math.min(13, player.position.x));
            player.position.z = Math.max(-13, Math.min(13, player.position.z));

            // 보스 투사체 업데이트 및 충돌 체크
            projectiles.forEach((p, idx) => {
                p.mesh.position.addScaledVector(p.dir, p.speed);
                if(p.mesh.position.distanceTo(player.position) < 0.8) {
                    isGameOver = true;
                    document.getElementById('result-title').innerText = "DEFEATED";
                    document.getElementById('final-stats').innerText = "보스의 공격에 쓰러졌습니다.";
                    document.getElementById('game-over').style.display = 'block';
                }
            });

            // 시간 표시
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('time-display').innerText = `⏱️ ${elapsed}s`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
